name: Publish to Modrinth and CurseForge

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump strategy (ignored if release_version is provided)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      release_version:
        description: 'Exact release version (leave blank to auto-bump from pom.xml)'
        required: false
        default: ''
        type: string
      version_type:
        description: 'Release type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      game_version:
        description: 'Minecraft target version (leave blank to auto-detect from pom.xml)'
        required: false
        default: ''
        type: string
      publish_target:
        description: 'Publish platform (all: Modrinth + CurseForge, modrinth: Modrinth only, curseforge: CurseForge only)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - modrinth
          - curseforge
      modrinth_id:
        description: 'Modrinth project slug or ID (leave blank to use MODRINTH_PROJECT_ID secret/var or default speedrunswitch)'
        required: false
        default: ''
        type: string
      curseforge_id:
        description: 'CurseForge project slug or ID (leave blank to use CURSEFORGE_PROJECT_ID secret/var or default 1697916)'
        required: false
        default: ''
        type: string
      changelog:
        description: 'Changelog / Release notes (leave blank to auto-detect from commits)'
        required: false
        default: ''
        type: string

jobs:
  publish:
    name: Build and Upload to Modrinth & CurseForge
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve & Bump Release Version
        id: ver
        run: |
          CURRENT_VER=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; print(tree.findtext('.//m:version', '', namespaces=ns).strip())")
          echo "Current POM version: $CURRENT_VER"

          TARGET_VER=$(python3 .github/scripts/bump_version.py "${{ inputs.release_version }}" "${{ inputs.bump }}" "${{ github.ref_name }}" "${{ github.event_name }}")
          echo "Target Release version: $TARGET_VER"
          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$TARGET_VER" >> "$GITHUB_OUTPUT"

          VER_TYPE="${{ inputs.version_type }}"
          if [ -z "$VER_TYPE" ]; then
            if [[ "$TARGET_VER" =~ (alpha|a) ]]; then
              VER_TYPE="alpha"
            elif [[ "$TARGET_VER" =~ (beta|b|pre|rc) ]]; then
              VER_TYPE="beta"
            else
              VER_TYPE="release"
            fi
          fi
          echo "version_type=$VER_TYPE" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VER" != "$TARGET_VER" ]; then
            echo "Updating pom.xml version from $CURRENT_VER to $TARGET_VER..."
            python3 .github/scripts/bump_version.py --update "${{ inputs.release_version }}" "${{ inputs.bump }}" "${{ github.ref_name }}" "${{ github.event_name }}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pom.xml
            git commit -m "chore(release): bump version to $TARGET_VER [skip ci]"
            git fetch origin main
            git push origin HEAD:main || echo "::warning::Could not push pom.xml update to main"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="v$TARGET_VER"
            if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Creating and pushing tag $TAG_NAME..."
              git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
              git push origin "$TAG_NAME" || echo "Tag $TAG_NAME push skipped"
            fi
          fi

      - name: Prepare Minecraft Dependency
        id: prepare-mc
        run: |
          mkdir -p libs/
          MC_VERSION="${{ inputs.game_version }}"
          if [ -z "$MC_VERSION" ]; then
            MC_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; print(tree.findtext('.//m:minecraft.version', '', namespaces=ns).strip())" 2>/dev/null || sed -n 's/.*<minecraft\.version>\(.*\)<\/minecraft\.version>.*/\1/p' pom.xml | head -n 1 | tr -d '[:space:]')
          fi
          if [ -z "$MC_VERSION" ]; then
            MC_VERSION="26.3"
          fi
          echo "Target Minecraft version: $MC_VERSION"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

          MC_JAR_PATH="libs/minecraft-${MC_VERSION}.jar"
          if [ ! -f "$MC_JAR_PATH" ]; then
            echo "Fetching Minecraft ${MC_VERSION} client jar from Mojang..."
            VERSION_MANIFEST=$(curl -sSfL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
            VERSION_URL=$(echo "$VERSION_MANIFEST" | jq -r --arg v "$MC_VERSION" '.versions[] | select(.id==$v) | .url')
            if [ -z "$VERSION_URL" ] || [ "$VERSION_URL" = "null" ]; then
              echo "::error::Version $MC_VERSION was not found in Mojang version manifest!"
              exit 1
            fi
            CLIENT_JAR_URL=$(curl -sSfL "$VERSION_URL" | jq -r '.downloads.client.url')
            if [ -z "$CLIENT_JAR_URL" ] || [ "$CLIENT_JAR_URL" = "null" ]; then
              echo "::error::Client download URL for $MC_VERSION was not found!"
              exit 1
            fi
            echo "Downloading client jar from $CLIENT_JAR_URL..."
            curl -sSfL "$CLIENT_JAR_URL" -o "$MC_JAR_PATH"
            echo "Minecraft jar downloaded successfully to $MC_JAR_PATH."
          fi
          if [ ! -f "$MC_JAR_PATH" ]; then
            echo "::error::Minecraft jar file $MC_JAR_PATH is missing!"
            exit 1
          fi

      - name: Build Mod with Maven
        run: mvn clean package --no-transfer-progress -DskipTests -Dminecraft.version="${{ steps.prepare-mc.outputs.mc_version }}"

      - name: Resolve Release Artifact & Metadata
        id: meta
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "speedrun-switch-*.jar" ! -name "original-*" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(find target -maxdepth 1 -name "*.jar" ! -name "original-*" ! -name "*-sources.jar" | head -n 1)
          fi
          if [ -z "$JAR_PATH" ] || [ ! -f "$JAR_PATH" ]; then
            echo "Error: Mod jar file not found in target/"
            exit 1
          fi
          echo "Found mod jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

          CHANGELOG="${{ inputs.changelog }}"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="${{ github.event.release.body }}"
          fi
          if [ -z "$CHANGELOG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges 2>/dev/null || echo "")
            else
              COMMITS=$(git log -n 10 --oneline --no-merges 2>/dev/null || echo "")
            fi
            if [ -n "$COMMITS" ]; then
              CHANGELOG=$(printf "Release Speedrun Switch v%s for Minecraft %s\n\n### Changes:\n%s" "${{ steps.ver.outputs.version }}" "${{ steps.prepare-mc.outputs.mc_version }}" "$COMMITS")
            else
              CHANGELOG="Release Speedrun Switch v${{ steps.ver.outputs.version }} for Minecraft ${{ steps.prepare-mc.outputs.mc_version }}"
            fi
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          RAW_PROJECT="${{ inputs.modrinth_id || vars.MODRINTH_PROJECT_ID || 'speedrunswitch' }}"
          echo "Input Modrinth project/slug: $RAW_PROJECT"
          PROJECT_ID="$RAW_PROJECT"
          PROJECT_SLUG="$RAW_PROJECT"

          if [[ ! "$RAW_PROJECT" =~ ^[a-zA-Z0-9]{8}$ ]]; then
            echo "Project '$RAW_PROJECT' appears to be a slug. Querying Modrinth API for 8-char Base62 project ID..."
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" \
              -H "User-Agent: SkyCraftServer/SpeedrunSwitch (https://github.com/SkyCraftServer/SpeedRunSwitch)" \
              "https://api.modrinth.com/v2/project/${RAW_PROJECT}")
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
            BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" -eq 200 ]; then
              RESOLVED_ID=$(echo "$BODY" | jq -r '.id // empty')
              RESOLVED_SLUG=$(echo "$BODY" | jq -r '.slug // empty')
              if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "null" ]; then
                echo "Successfully resolved project ID: $RESOLVED_ID"
                PROJECT_ID="$RESOLVED_ID"
              fi
              if [ -n "$RESOLVED_SLUG" ] && [ "$RESOLVED_SLUG" != "null" ]; then
                PROJECT_SLUG="$RESOLVED_SLUG"
              fi
            else
              echo "::warning::Failed to resolve project ID from slug (HTTP $HTTP_CODE): $BODY"
            fi
          fi

          echo "Final Modrinth project ID: $PROJECT_ID"
          echo "Final Modrinth project slug: $PROJECT_SLUG"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "project_slug=$PROJECT_SLUG" >> "$GITHUB_OUTPUT"

          RAW_CF_PROJECT="${{ inputs.curseforge_id || vars.CURSEFORGE_PROJECT_ID || '1697916' }}"
          echo "Input CurseForge project: $RAW_CF_PROJECT"
          CF_PROJECT_ID="$RAW_CF_PROJECT"

          if [[ "$RAW_CF_PROJECT" == "speedrun-switch" ]]; then
            CF_PROJECT_ID="1697916"
          elif [[ ! "$RAW_CF_PROJECT" =~ ^[0-9]+$ ]]; then
            echo "CurseForge project '$RAW_CF_PROJECT' is not numeric. Querying CurseForge API to resolve project ID..."
            CF_KEY='$2a$10$bL4bIL5pUWqfcO7KQtnMReakwtfHbNKh6v1uTpKlzhwoueEJQnPnm'
            CF_SEARCH_RESP=$(curl -s -H "x-api-key: $CF_KEY" "https://api.curseforge.com/v1/mods/search?gameId=432&slug=${RAW_CF_PROJECT}")
            RESOLVED_CF_ID=$(echo "$CF_SEARCH_RESP" | jq -r '.data[0].id // empty' 2>/dev/null || echo "")
            if [ -n "$RESOLVED_CF_ID" ] && [ "$RESOLVED_CF_ID" != "null" ]; then
              echo "Successfully resolved CurseForge project ID: $RESOLVED_CF_ID"
              CF_PROJECT_ID="$RESOLVED_CF_ID"
            else
              echo "::warning::Could not resolve CurseForge project ID from slug '$RAW_CF_PROJECT'. Falling back to default 1697916"
              CF_PROJECT_ID="1697916"
            fi
          fi

          echo "Final CurseForge project ID: $CF_PROJECT_ID"
          echo "curseforge_id=$CF_PROJECT_ID" >> "$GITHUB_OUTPUT"

          PUBLISH_TARGET="${{ inputs.publish_target || 'all' }}"
          echo "Publish target platform: $PUBLISH_TARGET"
          DO_MODRINTH="true"
          DO_CURSEFORGE="true"
          if [ "$PUBLISH_TARGET" = "modrinth" ]; then
            DO_CURSEFORGE="false"
          elif [ "$PUBLISH_TARGET" = "curseforge" ]; then
            DO_MODRINTH="false"
          fi
          echo "Target flags -> Modrinth: $DO_MODRINTH, CurseForge: $DO_CURSEFORGE"
          echo "do_modrinth=$DO_MODRINTH" >> "$GITHUB_OUTPUT"
          echo "do_curseforge=$DO_CURSEFORGE" >> "$GITHUB_OUTPUT"

      - name: Update Modrinth Project Description
        if: steps.meta.outputs.do_modrinth == 'true' && env.MODRINTH_TOKEN != ''
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ steps.meta.outputs.project_slug }}
          readme: 'README.md'
          branch: 'main'
          project-name: 'SpeedrunSwitch'

      - name: Check Modrinth Token
        if: steps.meta.outputs.do_modrinth == 'true' && env.MODRINTH_TOKEN == ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          echo "::warning::MODRINTH_TOKEN secret is not set. Skipping Modrinth upload."

      - name: Publish to Modrinth
        if: steps.meta.outputs.do_modrinth == 'true' && env.MODRINTH_TOKEN != ''
        uses: cloudnode-pro/modrinth-publish@v2
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ steps.meta.outputs.project_id }}
          name: "Speedrun Switch v${{ steps.ver.outputs.version }} [${{ steps.prepare-mc.outputs.mc_version }}]"
          version: ${{ steps.ver.outputs.version }}
          channel: ${{ steps.ver.outputs.version_type }}
          game-versions: ${{ steps.prepare-mc.outputs.mc_version }}
          loaders: fabric
          files: ${{ steps.meta.outputs.jar_path }}
          dependencies: '[{ "project_id": "P7dR8mSH", "dependency_type": "required" }, { "project_id": "9eGKb6K1", "dependency_type": "optional" }]'
          changelog: ${{ steps.meta.outputs.changelog }}

      - name: Check CurseForge Token
        if: steps.meta.outputs.do_curseforge == 'true' && env.CURSEFORGE_TOKEN == ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          echo "::warning::CURSEFORGE_TOKEN secret is not set. Skipping CurseForge upload. To publish to CurseForge, create an API token at https://authors.curseforge.com/account/api-tokens and add it as CURSEFORGE_TOKEN under repository Settings -> Secrets and variables -> Actions."

      - name: Publish to CurseForge
        if: steps.meta.outputs.do_curseforge == 'true' && env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: ${{ steps.meta.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.meta.outputs.jar_path }}
          name: "Speedrun Switch v${{ steps.ver.outputs.version }} [${{ steps.prepare-mc.outputs.mc_version }}]"
          version: ${{ steps.ver.outputs.version }}
          version-type: ${{ steps.ver.outputs.version_type }}
          game-versions: ${{ steps.prepare-mc.outputs.mc_version }}
          loaders: fabric
          curseforge-dependencies: |
            fabric-api(required)
            simple-voice-chat(optional)
          changelog: ${{ steps.meta.outputs.changelog }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: "Speedrun Switch v${{ steps.ver.outputs.version }} [${{ steps.prepare-mc.outputs.mc_version }}]"
          body: ${{ steps.meta.outputs.changelog }}
          prerelease: ${{ steps.ver.outputs.version_type != 'release' }}
          files: ${{ steps.meta.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: speedrun-switch-release-jar
          path: ${{ steps.meta.outputs.jar_path }}
          if-no-files-found: warn
